<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4 text-center" style="width: 100%; max-width: 400px; border-radius: 10px;">
        
        <h2 class="mb-4">Daftar Akun</h2>

        <form id="registerForm">
            <!-- Input Email -->
            <div class="mb-3 text-start">
                <label for="email" class="form-label small text-muted">Alamat Email</label>
                <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
            </div>

            <!-- Input Password -->
            <div class="mb-3 text-start">
                <label for="password" class="form-label small text-muted">Kata Sandi (Min. 6 Karakter)</label>
                <input type="password" id="password" class="form-control" placeholder="Buat password" minlength="6" required>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Daftar Sekarang</button>
        </form>

        <!-- Tautan Ke Halaman Login -->
        <div class="mt-4 small">
            Sudah punya akun? <a href="masuk.html" class="text-decoration-none">Masuk di sini</a>
        </div>

    </div>
</div>

<!-- JavaScript Modul Autentikasi -->
<script type="module" src="js/auth.js"></script>

</body>
</html>
