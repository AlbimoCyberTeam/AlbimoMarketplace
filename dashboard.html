<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <!-- Header Dashboard & Tombol Kembali -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Dashboard Admin</h2>
        <a href="admin-panel.html" class="btn btn-outline-secondary btn-sm">
            ⬅️ Kembali ke Panel
        </a>
    </div>

    <!-- Grid Ringkasan Data -->
    <div class="row g-4">
        <!-- Kartu Total Produk -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 text-center h-100">
                <div class="card-body py-4">
                    <div class="text-primary mb-2">
                        <!-- Representasi ikon teks sederhana -->
                        <span style="font-size: 1.5rem;">📦</span>
                    </div>
                    <h3 id="totalProduk" class="display-6 fw-bold text-primary">0</h3>
                    <p class="text-muted mb-0 fw-medium">Total Jenis Produk</p>
                </div>
            </div>
        </div>

        <!-- Kartu Total Pesanan -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 text-center h-100">
                <div class="card-body py-4">
                    <div class="text-success mb-2">
                        <span style="font-size: 1.5rem;">📋</span>
                    </div>
                    <h3 id="totalOrder" class="display-6 fw-bold text-success">0</h3>
                    <p class="text-muted mb-0 fw-medium">Total Pesanan Masuk</p>
                </div>
            </div>
        </div>

        <!-- Kartu Total Pengguna -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 text-center h-100">
                <div class="card-body py-4">
                    <div class="text-warning mb-2">
                        <span style="font-size: 1.5rem;">👤</span>
                    </div>
                    <h3 id="totalUser" class="display-6 fw-bold text-warning">0</h3>
                    <p class="text-muted mb-0 fw-medium">Total Pengguna Terdaftar</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript Modul Dashboard -->
<script type="module" src="js/dashboard.js"></script>

</body>
</html>
