<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4 text-center" style="width: 100%; max-width: 400px; border-radius: 10px;">
        
        <h2 class="mb-4">Masuk</h2>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <label for="email" class="form-label small text-muted">Alamat Email</label>
                <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
            </div>

            <div class="mb-3 text-start">
                <label for="password" class="form-label small text-muted">Kata Sandi</label>
                <input type="password" id="password" class="form-control" placeholder="Masukkan password Anda" required>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 mt-2">Masuk Sekarang</button>
        </form>

        <div class="mt-4 small">
            Belum punya akun? <a href="daftar.html" class="text-decoration-none">Daftar di sini</a>
        </div>

    </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
