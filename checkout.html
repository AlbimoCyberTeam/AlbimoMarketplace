<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row g-5">
        <!-- Kolom Kiri: Formulir Pengiriman -->
        <div class="col-md-7">
            <h2 class="mb-4">Informasi Pengiriman</h2>
            <form id="checkoutForm">
                
                <div class="mb-3">
                    <label for="namaPenerima" class="form-label">Nama Penerima</label>
                    <input type="text" id="namaPenerima" class="form-control" placeholder="Nama lengkap Anda" required>
                </div>

                <div class="mb-3">
                    <label for="alamatLengkap" class="form-label">Alamat Lengkap</label>
                    <textarea id="alamatLengkap" class="form-control" rows="3" placeholder="Nama jalan, nomor rumah, RT/RW, kecamatan, kota" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="noHp" class="form-label">No. Handphone</label>
                    <input type="tel" id="noHp" class="form-control" placeholder="Contoh: 081234567xxx" required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 mt-3">Buat Pesanan</button>
            </form>
        </div>

        <!-- Kolom Kanan: Ringkasan Pesanan (Dapat diisi dinamis via JS) -->
        <div class="col-md-5">
            <div class="card bg-light p-4">
                <h4 class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-primary">Ringkasan Belanja</span>
                </h4>
                <ul class="list-group mb-3" id="orderItemsContainer">
                    <!-- Item belanjaan akan muncul di sini menggunakan JavaScript -->
                    <li class="list-group-item d-flex justify-content-between lh-sm">
                        <div>
                            <h6 class="my-0 text-muted">Total Pembayaran otomatis dihitung di script</h6>
                        </div>
                    </li>
                </ul>
                <div class="d-flex justify-content-between">
                    <strong>Total (IDR)</strong>
                    <strong id="totalHarga">Rp 0</strong>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript Modul Checkout -->
<script type="module" src="js/checkout.js"></script>

</body>
</html>
