<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pembayaran</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4 text-center" style="width: 100%; max-width: 450px; border-radius: 10px;">
        
        <h2 class="mb-2">Pembayaran QRIS</h2>
        <p class="text-muted small mb-4">Silakan pindai kode QR di bawah ini untuk menyelesaikan pesanan Anda.</p>

        <!-- Tambahan: Wadah Informasi Total Tagihan Dinamis -->
        <div class="alert alert-warning py-2 fw-bold mb-4">
            Total Tagihan: <span id="totalTagihan">Rp 0</span>
        </div>

        <!-- Gambar QRIS -->
        <div class="mb-4 bg-white p-2 border rounded d-inline-block mx-auto">
            <img src="assets/qris.jpg" alt="Kode QRIS Pembayaran" class="img-fluid" style="max-width: 250px; width: 100%;">
        </div>

        <!-- Formulir Upload Bukti -->
        <form id="paymentForm" class="text-start">
            <div class="mb-3">
                <label for="bukti" class="form-label small text-muted fw-medium">Upload Bukti Transfer (Foto/Screenshot)</label>
                <!-- Perbaikan: Menambahkan accept="image/*" -->
                <input type="file" id="bukti" class="form-control" accept="image/*" required>
            </div>

            <!-- Perbaikan: Menambahkan type="submit" -->
            <button type="submit" class="btn btn-success w-100 py-2 mt-2">
                🚀 Kirim Bukti Transfer
            </button>
        </form>

    </div>
</div>

<!-- JavaScript Modul Pembayaran -->
<script type="module" src="js/payment.js"></script>

</body>
</html>
