<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Keranjang Belanja</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">🛒 Keranjang Belanja</h2>

    <div class="row g-4">
        <!-- Kolom Kiri: Daftar Item di Keranjang -->
        <div class="col-lg-8">
            <div id="cart-items">
                <!-- Item keranjang akan dimuat otomatis oleh js/cart.js -->
                <!-- Contoh tampilan kosong jika diatur oleh JS nantinya -->
            </div>
            
            <!-- Tombol Kembali Belanja -->
            <div class="mt-3">
                <a href="index.html" class="btn btn-outline-secondary">
                    ⬅️ Lanjut Belanja
                </a>
            </div>
        </div>

        <!-- Kolom Kanan: Ringkasan Total Belanja -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 position-sticky" style="top: 20px;">
                <div class="card-body p-4">
                    <h4 class="card-title mb-3 fs-5 fw-bold">Ringkasan Belanja</h4>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="text-muted">Total Harga</span>
                        <h4 class="mb-0 fw-bold text-primary" id="total">Rp 0</h4>
                    </div>
                    
                    <!-- Tombol Aksi -->
                    <div class="d-grid shadow-sm">
                        <a href="checkout.html" id="checkoutBtn" class="btn btn-success btn-lg py-2 fs-6">
                            Lanjut ke Checkout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript Modul Keranjang -->
<script type="module" src="js/cart.js"></script>

</body>
</html>
