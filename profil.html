<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil Saya</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <!-- Bagian Atas: Judul & Tombol Kembali -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">👤 Profil Saya</h2>
        <a href="dashboard-user.html" class="btn btn-outline-secondary btn-sm">
            ⬅️ Kembali
        </a>
    </div>

    <!-- Kartu Informasi Profil -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <!-- Nama Pengguna -->
            <div class="mb-3 border-bottom pb-2">
                <label class="text-muted small d-block mb-1 fw-medium">Nama Lengkap</label>
                <h4 id="nama" class="text-dark mb-0">Memuat nama...</h4>
            </div>

            <!-- Email Pengguna -->
            <div class="mb-3 border-bottom pb-2">
                <label class="text-muted small d-block mb-1 fw-medium">Alamat Email</label>
                <p id="email" class="text-dark mb-0">Memuat email...</p>
            </div>

            <!-- Peran / Role Akun -->
            <div class="mb-2">
                <label class="text-muted small d-block mb-1 fw-medium">Status Akun / Role</label>
                <!-- Menambahkan kelas badge agar tampilan status (Admin/User) terlihat menarik -->
                <span id="role" class="badge bg-secondary px-3 py-2 fs-6">-</span>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript Modul Profil -->
<script type="module" src="js/profile.js"></script>

</body>
</html>
