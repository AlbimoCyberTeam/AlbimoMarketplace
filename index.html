<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace Store</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Berkas CSS Sendiri -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">
        <i class="fas fa-shopping-cart me-2"></i>Marketplace Store
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">
              <i class="fas fa-home me-1"></i> Beranda
            </a>
          </li>
          <!-- Tambahan: Navigasi Keranjang Belanja -->
          <li class="nav-item">
            <a class="nav-link position-relative me-2" href="checkout.html">
              <i class="fas fa-shopping-basket me-1"></i> Keranjang
              <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="daftar.html">
              <i class="fas fa-user-plus me-1"></i> Daftar
            </a>
          </li>
          <li class="nav-item">
            <!-- Perbaikan: Mengubah masuk.html menjadi login.html sesuai keselarasan file -->
            <a class="nav-link" href="login.html">
              <i class="fas fa-sign-in-alt me-1"></i> Masuk
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  
  <!-- Bagian Sambutan -->
  <section class="bg-light py-5">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h1 class="display-5 fw-bold text-primary">Belanja Mudah & Nyaman</h1>
          <p class="lead text-muted">Temukan berbagai produk terbaik dari penjual terpercaya.</p>
        </div>
        <div class="col-md-6 text-center">
          <img src="https://cdn-icons-png.flaticon.com/512/3343/3343857.png"
               alt="Belanja"
               class="img-fluid"
               style="max-height:250px;">
        </div>
      </div>
    </div>
  </section>

  <!-- Fitur Pencarian -->
  <div class="container mt-4">
    <div class="input-group shadow-sm">
      <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
      <input type="text" id="pencarian" class="form-control border-start-0" placeholder="Cari produk berdasarkan nama...">
    </div>
  </div>

  <!-- Daftar Produk -->
  <section class="py-5">
    <div class="container">
      <h2 class="mb-4 fw-bold text-center">✨ Produk Terbaru</h2>
      <!-- Perbaikan: Wadah produk dinamis -->
      <div class="row g-4" id="wadah-produk">
          <!-- Item produk akan dimuat otomatis oleh js/products.js -->
      </div>
    </div> <!-- Perbaikan: Menambahkan tag penutup container yang hilang -->
  </section>

  <!-- Footer -->
  <footer class="bg-primary text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0">© 2026 Marketplace Store - Dibangun untuk pembelajaran</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Skrip Sendiri -->
  <script type="module" src="js/products.js"></script>
</body>
</html>
